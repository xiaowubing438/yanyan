<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body,
        html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>



    <script src="./js/Three.js"></script>
    <script src="./js/OrbitControls.js"></script>
    <script src="./js/GLTFLoader.js"></script>
    <!-- <script src="./js/OutlineEffect.js"></script>
    <script src="./js/MMDToonShader.js"></script>
    <script src="./js/MMDLoader.js"></script>
    <script src="./js/CCDIKSolver.js"></script>
    <script src="./js/MMDPhysics.js"></script>

    <script>
        // console.log('THREE', THREE);

        // console.log('OrbitControls', THREE.OrbitControls);


        var scene = new THREE.Scene();
            var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

            const listener = new THREE.AudioListener();
            camera.add( listener );

            scene.add(camera)

            var renderer = new THREE.WebGLRenderer({
                antialias: true,
                // logarithmicDepthBuffer: true,
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            // renderer.setClearColor(0xFFFFFF); // 设置场景背景色
            renderer.shadowMap.enabled = true
            renderer.setPixelRatio( window.devicePixelRatio );
            // renderer.outputEncoding = THREE.sRGBEncoding;
    
            camera.position.set(0, 0, 0);
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.update();
            
            document.body.appendChild(renderer.domElement);
    
            // var geometry = new THREE.BoxGeometry(1, 1, 1);
            // var material = new THREE.MeshLambertMaterial({ color: 0x00ff00 }); // MeshBasicMaterial基础网格材质不受光照影响
            // var cube = new THREE.Mesh(geometry, material);
            // cube.castShadow = true
            // cube.receiveShadow = true
            // scene.add(cube);
    
            var light = new THREE.AmbientLight(0xFFFFFF); // soft white light
            light.position.set(0, 0, -0);
            scene.add(light);

        var loader = new THREE.GLTFLoader();
        var  meshes = [];
        // bingdundun
        loader.load('./bing/bingdundun.glb', function(mesh) {
            mesh.scene.traverse(function(child) {
                if (child.isMesh) {
                    // meshes.push(child)
                    if (child.name === 'oldtiger001') {
                        child.material.metalness = .3;
                        child.material.roughness = .8;
                    }
                    if (child.name === 'oldtiger002') {
                        child.material.transparent = true;
                        child.material.opacity = .4;
                        child.material.metalness = .3;
                        child.material.roughness = 0;
                        child.material.refractionRatio = 1.6;
                        child.castShadow = true;
                        // child.material.envMap = new THREE.TextureLoader().load(skyTexture);
                        child.material.envMapIntensity = 1;
                    }
                }
            });

            console.log(mesh);
            // mesh.scene.rotation.y = Math.PI / 24;
            // mesh.scene.position.z = -50;
            // mesh.scene.scale.set(24, 24, 24);
            scene.add(mesh.scene);
        });


        // 渲染场景和相机
        renderer.render(scene, camera)

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>

</html>
